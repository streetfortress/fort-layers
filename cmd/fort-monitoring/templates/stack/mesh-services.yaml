# Mesh exposure: the edge clusters the hub watches reach it at its mesh
# address — NodePorts because the ingress path (Gateway hostnames, TLS)
# means nothing to a remote_write client on the mesh. The ports are
# opened on the mesh interface by the layer's module
# (modules/monitoring/hub.nix, sfi.monitoring-hub in the host file).
# NodePort range caps at 32767, hence 31100 for Loki rather than a 3100
# mnemonic.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-central-mesh
  namespace: monitoring-central
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: central
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      nodePort: 30990
---
apiVersion: v1
kind: Service
metadata:
  name: loki-mesh
  namespace: monitoring-central
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 31100
